state_file = "auto"
engine = "parakeet"

[hotkey]
enabled = true
key = "RIGHTALT"
mode = "push_to_talk"

[audio]
device = "default"
sample_rate = 16000
max_duration_secs = 60
pause_media = true
duck_media = false
duck_media_volume_percent = 34
duck_media_fade_ms = 150

[audio.feedback]
enabled = false
theme = "default"
volume = 0.7

[whisper]
model = "small"
language = "en"
translate = false
mode = "local"
flash_attention = false
on_demand_loading = false
gpu_isolation = false
eager_processing = false

[output]
mode = "paste"
fallback_to_clipboard = true
type_delay_ms = 1
auto_submit = false
shift_enter_newlines = false
pre_type_delay_ms = 0

[output.notification]
on_recording_start = false
on_recording_stop = false
on_transcription = false
show_engine_icon = false

[parakeet]
model = "parakeet-tdt-0.6b-v3"
on_demand_loading = false
streaming = false

[text]
spoken_punctuation = false
smart_auto_submit = false

