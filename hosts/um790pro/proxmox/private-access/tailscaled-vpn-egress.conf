[Unit]
# Reuse the existing mixed proxy; never restart/reconfigure the guest VPN.
Wants=pve-guest-vpn.service
After=pve-guest-vpn.service

[Service]
# Control, DERP HTTPS and log transport use the existing VPN egress.
# Direct Tailscale peer/UDP paths are still allowed; DERP remains the fallback.
Environment="HTTP_PROXY=http://10.77.6.1:2081"
Environment="HTTPS_PROXY=http://10.77.6.1:2081"
Environment="NO_PROXY=localhost,127.0.0.1,::1,100.64.0.0/10,fd7a:115c:a1e0::/48,192.168.1.0/24,10.77.6.0/24,10.77.7.0/24"
# The installed Tailscale version documents post-handshake TCP/80 blackholes.
# Use its supported HTTPS-only Noise underlay as well as the VPN proxy.
Environment="TS_FORCE_NOISE_443=true"
# Do not let Tailscale create automatic router forwarding rules.
Environment="TS_DISABLE_PORTMAPPER=true"
