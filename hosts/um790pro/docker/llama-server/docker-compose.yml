services:
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan
    container_name: llama-server
    restart: unless-stopped
    network_mode: host
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
      - /dev/dri/card1:/dev/dri/card1
    volumes:
      - hf-cache:/root/.cache/huggingface
    command:
      - -hf
      - unsloth/Qwen3.6-35B-A3B-MTP-GGUF:UD-Q4_K_M
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - -c
      - "16348"
      - --parallel
      - "1"
      - --flash-attn
      - "on"
      - --spec-type
      - draft-mtp
      - --spec-draft-n-max
      - "2"
      - --cache-ram
      - "1024"
      - --n-gpu-layers
      - "999"
      - --metrics
      - --reasoning
      - "off"
      - --chat-template-kwargs
      - '{"enable_thinking": false}'
    logging:
      driver: local
      options:
        max-size: 200m
        max-file: "3"

  llama-dashboard:
    build:
      context: /home/nik/pro/llama-dashboard
      network: host
    image: llama-dashboard:local
    container_name: llama-dashboard
    restart: unless-stopped
    init: true
    network_mode: host
    depends_on:
      llama-server:
        condition: service_healthy
      embedding-server:
        condition: service_healthy
    environment:
      LLD_UPSTREAMS_JSON: >-
        [{"key":"generation","label":"Generation","role":"generation","upstreamUrl":"http://127.0.0.1:8080","listener":{"host":"0.0.0.0","port":8081}},{"key":"embedding","label":"Embeddings","role":"embedding","upstreamUrl":"http://100.95.213.117:8083","listener":{"host":"0.0.0.0","port":8084},"inputCapture":false}]
      LLD_DEFAULT_UPSTREAM_KEY: generation
      LLD_UI_PORT: "8082"
      LLD_HOST: 0.0.0.0
      LLD_DB_PATH: /data/llama-dashboard.db
    volumes:
      - dashboard-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8082/api/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: local
      options:
        max-size: 200m
        max-file: "3"

  embedding-server:
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan
    container_name: embedding-server
    restart: unless-stopped
    network_mode: host
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
      - /dev/dri/card1:/dev/dri/card1
    volumes:
      - hf-cache:/root/.cache/huggingface
    command:
      - -hf
      - Qwen/Qwen3-Embedding-4B-GGUF:Q4_K_M
      - --host
      - 100.95.213.117
      - --port
      - "8083"
      - -c
      - "8192"
      - --parallel
      - "1"
      - --flash-attn
      - "on"
      - --embedding
      - --pooling
      - last
      - --embd-normalize
      - "2"
      - --n-gpu-layers
      - auto
      - --metrics
      - --no-webui
    healthcheck:
      test: ["CMD", "curl", "-f", "http://100.95.213.117:8083/health"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 10s
    logging:
      driver: local
      options:
        max-size: 200m
        max-file: "3"

volumes:
  hf-cache:
  dashboard-data:
