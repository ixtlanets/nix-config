# Local MQTT broker for Home Assistant <-> Frigate.
# Host-exposure is loopback-only thanks to the compose port map
# ("127.0.0.1:1883:1883") — keep that binding if the port is ever re-mapped.
# The in-container listener must stay on 1883 (all interfaces) so that
# containers on the shared "hamqtt" network (frigate) can reach it.
listener 1883
allow_anonymous true
