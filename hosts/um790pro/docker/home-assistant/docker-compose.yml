name: home-assistant

networks:
  hamqtt:
    name: hamqtt

services:
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    restart: unless-stopped
    network_mode: host
    # Bluetooth management on the host adapter (AX210) needs these caps;
    # without them habluetooth spams errors. Remove if BT is never wanted.
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./config:/config
    logging:
      driver: local
      options:
        max-size: 50m
        max-file: "3"

  mosquitto:
    container_name: mosquitto
    image: eclipse-mosquitto:2
    restart: unless-stopped
    networks: [hamqtt]
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./mosquitto:/mosquitto/config
    ports:
      - "127.0.0.1:1883:1883"
    logging:
      driver: local
      options:
        max-size: 50m
        max-file: "3"
