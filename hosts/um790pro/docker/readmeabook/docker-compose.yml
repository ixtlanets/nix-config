name: readmeabook

x-common-environment: &common-environment
  PUID: "1000"
  PGID: "1000"
  TZ: Europe/Moscow
  UMASK: "002"

x-common-logging: &common-logging
  driver: local
  options:
    max-size: 50m
    max-file: "3"

services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr@sha256:258523d25e4e07028c3a206f0e03ae807b26a50a201dd320f09a18464ecf86fa
    platform: linux/amd64
    container_name: readmeabook-flaresolverr
    restart: unless-stopped
    environment:
      # Info-level request logs include POST bodies and can expose indexer credentials.
      LOG_LEVEL: warning
      LOG_HTML: "false"
      CAPTCHA_SOLVER: none
      TZ: Europe/Moscow
    volumes:
      - ${READMABOOK_STATE_ROOT:-/home/nik/services/readmeabook}/flaresolverr:/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8191/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging: *common-logging
    networks:
      - backend

  rutracker-gateway:
    image: ghcr.io/flaresolverr/flaresolverr@sha256:258523d25e4e07028c3a206f0e03ae807b26a50a201dd320f09a18464ecf86fa
    platform: linux/amd64
    container_name: readmeabook-rutracker-gateway
    restart: unless-stopped
    depends_on:
      flaresolverr:
        condition: service_healthy
    entrypoint: ["/usr/bin/dumb-init", "--"]
    command: ["/usr/local/bin/python3", "-u", "/gateway/rutracker_gateway.py"]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      RUTRACKER_GATEWAY_FLARESOLVERR_URL: http://flaresolverr:8191/v1
      RUTRACKER_GATEWAY_LISTEN_HOST: 0.0.0.0
      RUTRACKER_GATEWAY_LISTEN_PORT: "8080"
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./scripts/rutracker_gateway.py:/gateway/rutracker_gateway.py:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    logging: *common-logging
    networks:
      - backend

  readmeabook:
    image: localhost/readmeabook:1.2.2-transmission-tracker-fix-1
    build:
      context: .
      dockerfile: Dockerfile.readmeabook
    platform: linux/amd64
    container_name: readmeabook
    restart: unless-stopped
    depends_on:
      prowlarr:
        condition: service_healthy
      transmission:
        condition: service_started
    environment:
      <<: *common-environment
      LOG_LEVEL: info
    entrypoint: /readmeabook/container-entrypoint.sh
    command: ["/usr/bin/supervisord", "-c", "/etc/supervisor/conf.d/supervisord.conf"]
    secrets:
      - source: rmab_jwt_secret
        target: rmab-jwt-secret
      - source: rmab_jwt_refresh_secret
        target: rmab-jwt-refresh-secret
      - source: rmab_config_encryption_key
        target: rmab-config-encryption-key
      - source: rmab_postgres_password
        target: rmab-postgres-password
    volumes:
      - ./scripts/container-entrypoint.sh:/readmeabook/container-entrypoint.sh:ro
      - ${READMABOOK_STATE_ROOT:-/home/nik/services/readmeabook}/rmab/config:/app/config
      - ${READMABOOK_STATE_ROOT:-/home/nik/services/readmeabook}/rmab/cache:/app/cache
      - ${READMABOOK_STATE_ROOT:-/home/nik/services/readmeabook}/downloads:/downloads
      - ${READMABOOK_STATE_ROOT:-/home/nik/services/readmeabook}/staging:/media
      - ${READMABOOK_STATE_ROOT:-/home/nik/services/readmeabook}/rmab/pgdata:/var/lib/postgresql/data
      - ${READMABOOK_STATE_ROOT:-/home/nik/services/readmeabook}/rmab/redis:/var/lib/redis
    ports:
      - 100.95.213.117:3030:3030
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3030/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging: *common-logging
    networks:
      - backend

  prowlarr:
    image: lscr.io/linuxserver/prowlarr@sha256:c7502a75b021d964481c129c84590b9cbc40f83aadd4e553f173871bc0deaa3c
    platform: linux/amd64
    container_name: readmeabook-prowlarr
    restart: unless-stopped
    depends_on:
      rutracker-gateway:
        condition: service_healthy
    environment: *common-environment
    volumes:
      - ${READMABOOK_STATE_ROOT:-/home/nik/services/readmeabook}/prowlarr:/config
    ports:
      - 127.0.0.1:9696:9696
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9696/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging: *common-logging
    networks:
      - backend

  transmission:
    image: lscr.io/linuxserver/transmission@sha256:fc3b07f2f571c0392edd4dd386067138a0fe157d2158a976769409a292e43936
    platform: linux/amd64
    container_name: readmeabook-transmission
    restart: unless-stopped
    entrypoint: /readmeabook/transmission-entrypoint.sh
    environment:
      <<: *common-environment
      USER: readmeabook
      HOST_WHITELIST: transmission
    secrets:
      - transmission_password
    volumes:
      - ./scripts/transmission-entrypoint.sh:/readmeabook/transmission-entrypoint.sh:ro
      - ${READMABOOK_STATE_ROOT:-/home/nik/services/readmeabook}/transmission:/config
      - ${READMABOOK_STATE_ROOT:-/home/nik/services/readmeabook}/downloads:/downloads
    logging: *common-logging
    networks:
      - backend

networks:
  backend:
    name: readmeabook-backend
    driver: bridge

secrets:
  rmab_config_encryption_key:
    file: ${READMABOOK_SECRETS_ROOT:-/etc/readmeabook/secrets}/rmab-config-encryption-key
  rmab_jwt_refresh_secret:
    file: ${READMABOOK_SECRETS_ROOT:-/etc/readmeabook/secrets}/rmab-jwt-refresh-secret
  rmab_jwt_secret:
    file: ${READMABOOK_SECRETS_ROOT:-/etc/readmeabook/secrets}/rmab-jwt-secret
  rmab_postgres_password:
    file: ${READMABOOK_SECRETS_ROOT:-/etc/readmeabook/secrets}/rmab-postgres-password
  transmission_password:
    file: ${READMABOOK_SECRETS_ROOT:-/etc/readmeabook/secrets}/transmission-password
