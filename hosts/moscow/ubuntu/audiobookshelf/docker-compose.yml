version: "3.8"

services:
  audiobookshelf:
    image: nix-config/audiobookshelf:2.36.0-arm64-14a6492c
    container_name: audiobookshelf
    restart: unless-stopped
    environment:
      AUDIOBOOKSHELF_GID: "100"
      AUDIOBOOKSHELF_UID: "99"
    ports:
      - "0.0.0.0:13378:80"
    volumes:
      - "${SOURCE_STATE_DIR:-/media/disk1/media/meta}:/config"
      - "${SOURCE_STATE_DIR:-/media/disk1/media/meta}:/metadata"
      - "${MEDIA_DIR:-/media/disk1/media/Audiobooks}:/audiobooks"
      - "${READMABOOK_MEDIA_DIR:-/media/disk1/media/ReadMeABook}:/readmeabook:ro"

  caddy:
    image: caddy:2.11.4
    container_name: audiobookshelf-caddy
    restart: unless-stopped
    depends_on:
      - audiobookshelf
    ports:
      - "0.0.0.0:443:443"
    volumes:
      - "./Caddyfile:/etc/caddy/Caddyfile:ro"
      - "${CADDY_DATA_DIR:-/home/nik/.local/state/audiobookshelf-caddy/data}:/data"
      - "${CADDY_CONFIG_DIR:-/home/nik/.local/state/audiobookshelf-caddy/config}:/config"
